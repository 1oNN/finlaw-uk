name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The suite is hermetic: tests/conftest.py disables the graph and remote
      # retrieval paths and points the corpus at an empty directory, and the
      # graph, verification and evaluation tests stub their external calls.
      # No Neo4j and no Ollama are needed here.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q tests/ --ignore=tests/smoke_chat_api.py
